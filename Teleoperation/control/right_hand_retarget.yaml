retargeting:
  type: "dexpilot"

  urdf_path: "/home/teleopstation/catkin_ws/src/Teleoperation/control/right_hand.urdf"

  wrist_link_name: "base_link"

  finger_tip_link_names:
    - R_finger_end_1   # 엄지 → Quest index 4
    - R_finger_end_2   # 검지 → Quest index 8
    - R_finger_end_3   # 중지 → Quest index 12
    - R_finger_end_4   # 약지 → Quest index 16

